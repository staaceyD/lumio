[tool.poetry]
name = "lumio"
version = "0.1.0"
description = "task management system"
authors = ["Anastasiia Derevianko <aderevianko@proton.me>"]
readme = "README.md"
# This is an application, not a distributable package: the Django project lives
# in core/ and there is no lumio/ package to install.
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
django = "^5.1.4"
djangorestframework = "^3.15.2"
django-cors-headers = "^4.6.0"
drf-spectacular = "^0.28.0"
python-dotenv = "^1.0.0"
pre-commit = "^4.1.0"
black = "^25.1.0"
isort = "^6.0.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
